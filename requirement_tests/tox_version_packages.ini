[tox]
envlist = {py312}-Pillow{800,801,810,811,812,820,830,831,832,840,900,901,910,911,920,930,940,950,1000,1001,1010,1020},
          {py312}-Plotly{4100,4110,4120,4130,4140,4141,4142,4143,500,510,521,522,530,531,540,550,560,570,580,581,582,590,5100,5110,5120,5130,5131,5140,5141,5150,5160,5161,5170,5180},
          {py312}-Pigar{090,091,092,100,101,102},flake8


[testenv:flake8]
basepython = python
deps = flake8
commands = flake8 pynavio tests

[testenv:base]
setenv =
    PYTHONPATH = {toxinidir}
deps =
    -r{toxinidir}/requirements_tox.txt

commands =
    pip install -U pip
    pytest tests --basetemp={envtmpdir}

[testenv]
deps =
    {[testenv:base]deps}
