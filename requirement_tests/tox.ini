# Run from project root with `tox -c requirement_tests/tox.ini`
# Warning: The tox testing with multiple mlflow versions is very resource intensive and will take lot of time.
# Consider commenting out a big part of mlflow versions if you want to try something.
# The versions mlflow 1.28.0 and 1.27.0 are supposed to fail and ignored to ensure that all envs succeed.

[tox]
requires = tox>=4.0
envlist =
    {py312,py311,py310}-mlflow{2.19}
    {py39}-mlflow{2.19,2.18,2.17,2.16,2.15,2.14,2.13,2.12,2.11,2.10,2.9,2.8,2.7,2.6,2.5,2.4,2.3,2.2,2.1,2.0,1.30,1.29,1.26,1.25,1.24,1.23,1.22,1.21,1.20}
    {py38,py37}-mlflow{1.20}
    flake8
setupdir = {toxinidir}/..
toxworkdir = {toxinidir}/../.tox
parallel_show_output = true
skip_missing_interpreters = true

[testenv]
changedir = {toxinidir}/..
deps =
    pytest==7.1.2
    scikit-learn==1.1.1
    -r{toxinidir}/../requirements.txt
    mlflow2.19: mlflow==2.19.*
    mlflow2.18: mlflow==2.18.*
    mlflow2.17: mlflow==2.17.*
    mlflow2.16: mlflow==2.16.*
    mlflow2.15: mlflow==2.15.*
    mlflow2.14: mlflow==2.14.*
    mlflow2.13: mlflow==2.13.*
    mlflow2.12: mlflow==2.12.*
    mlflow2.11: mlflow==2.11.*
    mlflow2.10: mlflow==2.10.*
    mlflow2.9: mlflow==2.9.*
    mlflow2.8: mlflow==2.8.*
    mlflow2.7: mlflow==2.7.*
    mlflow2.6: mlflow==2.6.*
    mlflow2.5: mlflow==2.5.*
    mlflow2.4: mlflow==2.4.*
    mlflow2.3: mlflow==2.3.*
    mlflow2.3: setuptools<60.0
    mlflow2.2: mlflow==2.2.*
    mlflow2.1: mlflow==2.1.*
    mlflow2.0: mlflow==2.0.*
    mlflow1.30: mlflow==1.30.*
    mlflow1.29: mlflow==1.29.*
    # The versions mlflow 1.28.0 and 1.27.0 are supposed to fail and commented out to ensure that all envs succeed.
    #mlflow1.28: mlflow==1.28.*
    #mlflow1.27: mlflow==1.27.*
    mlflow1.26: mlflow==1.26.*
    mlflow1.25: mlflow==1.25.*
    mlflow1.24: mlflow==1.24.*
    mlflow1.23: mlflow==1.23.*
    mlflow1.22: mlflow==1.22.*
    mlflow1.21: mlflow==1.21.*
    mlflow1.20: mlflow==1.20.*
    mlflow1.20: protobuf<=3.20.0
    mlflow1.20: numpy<1.20
commands =
    pytest tests --basetemp={envtmpdir}

[testenv:flake8]
deps = flake8==4.0.1
commands = flake8 pynavio tests
